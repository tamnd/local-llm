# Provisioning manifest: what each backend must have on disk before the gateway
# config that references it can serve. The provision scripts (scripts/06-models)
# read this to pull/download models idempotently. This is not the gateway config;
# it is the source-of-truth list the box is provisioned against. Keep the
# gateway's models block (configs/llmgw.yaml) in sync with the ids here.

# Ollama models are pulled by name from the Ollama registry.
ollama:
  models:
    - name: "qwen3:30b-a3b"
      note: "general chat + tools, MoE; ollama arm of the MoE bench grid"
    - name: "qwen3:32b"
      note: "dense 32B GGUF Q4_K_M; ollama arm of the dense bench grid"
    - name: "qwen3-coder:30b-a3b"
      note: "code-tuned sibling"
    - name: "nomic-embed-text"
      note: "embeddings, stays resident (coexist)"

# TabbyAPI (ExLlamaV3) serves EXL3 quants downloaded into its models dir. source
# is the Hugging Face repo; dir is the folder name TabbyAPI loads by (matches
# upstream_model in the gateway config). EXL3 supersedes EXL2 as the 2026 quant
# format, so the roster provisions EXL3 only.
tabby:
  models_dir: "C:/models/exl3"
  models:
    - dir: "Qwen3-32B-exl3-4.0bpw"
      source: "hf:turboderp/Qwen3-32B-exl3"
      revision: "4.0bpw"
      note: "dense 32B at 4bpw EXL3; ExLlamaV3 arm of the dense bench grid"
    - dir: "Qwen3-30B-A3B-exl3-4.0bpw"
      source: "hf:turboderp/Qwen3-30B-A3B-exl3"
      revision: "4.0bpw"
      note: "MoE 30B-A3B at 4bpw EXL3; ExLlamaV3 arm of the MoE bench grid"

# llama-server loads a single GGUF by path. Listed for completeness; not wired
# into the default gateway config. Swap in by adding a models entry with
# backend: llama and base_url pointing at the llama-server port.
llama:
  models_dir: "C:/models/gguf"
  models:
    - file: "Qwen3-14B-Q6_K.gguf"
      source: "hf:Qwen/Qwen3-14B-GGUF"
      note: "example dense GGUF for the llama-server backend"
    # Muse Glimmer is provisioned by scripts/10-llamacpp-muse.sh, which builds
    # llama.cpp from master (the arch is newer than every tagged win-cuda build)
    # and stages these onto the WSL2 ext4 disk at /root/models/gguf.
    - file: "Muse-Glimmer-30B-UD-Q4_K_XL.gguf"
      source: "hf:unsloth/Muse-Glimmer-30B-GGUF"
      note: "Meta Muse Glimmer 30B, dynamic 4-bit, 14.8 GiB; serves muse-glimmer-30b"
    - file: "dflash-kquant.gguf"
      source: "hf:unsloth/Muse-Glimmer-30B-GGUF"
      note: "Meta's DFlash draft head for speculative decoding; serves muse-glimmer-30b-dflash"
    # The projector is published at BF16 only; there is no mmproj-kquant.gguf in
    # the repo, and the earlier name here 404'd silently because the fetch was
    # not using curl -f. It is 1.4 GiB and costs ~3.9 GB resident.
    - file: "mmproj-Muse-Glimmer-30B-BF16.gguf"
      source: "hf:unsloth/Muse-Glimmer-30B-GGUF"
      note: "Muse Glimmer vision projector; required for image input, needs llama-server --mmproj"

# vLLM loads from a local AWQ/GPTQ checkout or an HF id. Process-driven backend;
# slow to start, fast to serve. dir is the local checkout the gateway config's
# upstream_model path points at; download with the wget recipe in scripts/08-vllm.sh.
vllm:
  models_dir: "/models/hf"
  models:
    - dir: "Qwen3-14B-FP8"
      source: "hf:Qwen/Qwen3-14B-FP8"
      note: "dense 14B FP8, the small-tier vLLM model (fits FP8 under 24 GB)"
    - dir: "Qwen3-32B-AWQ"
      source: "hf:Qwen/Qwen3-32B-AWQ"
      note: "dense 32B AWQ int4; vLLM arm of the dense bench grid, --quantization awq_marlin"
    - dir: "Qwen3-30B-A3B-AWQ"
      source: "hf:QuixiAI/Qwen3-30B-A3B-AWQ"
      note: "MoE 30B-A3B AWQ int4; vLLM arm of the MoE bench grid, --quantization awq_marlin. Qwen ships no public AWQ for the base MoE, so this community quant of the same base is the fair match to the GGUF and EXL3 arms."

# inproc loads a GGUF directly into the gateway process via the in-process cgo
# engine (the zero-proxy high-throughput path, spec 2065 docs 15 to 17). file is
# the GGUF the params.model_path in the gateway config points at; draft is the
# optional vocab-matched speculative draft. Needs make build-llama. Unsloth
# dynamic quants (UD-*) give the best quality per byte at the same decode speed.
inproc:
  models_dir: "/models/gguf"
  models:
    - file: "Qwen3-Coder-30B-UD-Q4_K_XL.gguf"
      source: "hf:unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF"
      draft: "Qwen3-1.7B-Q4_K_M.gguf"
      draft_source: "hf:Qwen/Qwen3-1.7B-GGUF"
      note: "dense-feel coder MoE with a vocab-matched 1.7B draft for greedy speculation"
    - file: "Qwen3.6-27B-UD-Q4_K_XL.gguf"
      source: "hf:unsloth/Qwen3.6-27B-GGUF"
      draft: "Qwen3-1.7B-Q4_K_M.gguf"
      draft_source: "hf:Qwen/Qwen3-1.7B-GGUF"
      note: "current dense general model, draft-accelerated"
    - file: "nomic-embed-text-v1.5.Q8_0.gguf"
      source: "hf:nomic-ai/nomic-embed-text-v1.5-GGUF"
      note: "embeddings in-process, coexist with the main slot (embedding: true)"
