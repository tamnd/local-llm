# llmgw gateway config for the RTX 4090 box. The schema is config.Config; every
# field documented here maps to a struct tag in config/config.go. A model the
# gateway should serve needs an entry under models; clients select it by the
# key (or by an alias below). VRAM numbers are the measured residency from spec
# 2065, used by the manager to decide what can coexist with the main slot.

bind:
  # api_addr binds the data plane. 0.0.0.0 is fine because the only route to this
  # port is the tailnet; the box's firewall blocks the port on every other
  # interface. Set this to the Tailscale IP to be strict.
  api_addr: "0.0.0.0:8888"
  # admin_addr stays on loopback so force-load and force-unload are unreachable
  # from the network.
  admin_addr: "127.0.0.1:8889"

auth:
  # Replace these before serving. Generate with: openssl rand -hex 24
  tokens:
    - "REPLACE_ME_data_plane_token"
  # admin_token guards /admin/*. Leave empty to disable the admin plane.
  admin_token: "REPLACE_ME_admin_token"

# default_model answers requests that omit the model field. It may be an alias.
default_model: chat

aliases:
  chat: qwen3-30b-a3b
  coder: qwen3-coder-30b-a3b
  reasoning: qwen3-32b-exl3
  embed: nomic-embed-text

models:
  # General chat and tool use. MoE, ~217-240 tok/s decode on the 4090 (spec 1991).
  qwen3-30b-a3b:
    backend: ollama
    base_url: "http://127.0.0.1:11434"
    upstream_model: "qwen3:30b-a3b"
    vram_mb: 19000
    params:
      keep_alive: "30m"

  # Code-tuned sibling, same MoE shape and footprint.
  qwen3-coder-30b-a3b:
    backend: ollama
    base_url: "http://127.0.0.1:11434"
    upstream_model: "qwen3-coder:30b-a3b"
    vram_mb: 19000
    params:
      keep_alive: "30m"

  # Dense 32B at ~4bpw EXL3 through TabbyAPI/ExLlamaV3. EXL3 supersedes EXL2 (the
  # 2026 quant format, better fidelity per bit), so the roster runs EXL3 only.
  qwen3-32b-exl3:
    backend: tabby
    base_url: "http://127.0.0.1:5000"
    upstream_model: "Qwen3-32B-exl3-4.0bpw"
    vram_mb: 20500
    params:
      quant: "exl3"
      admin_key: "REPLACE_ME_tabby_admin_key"
      max_seq_len: 32768
      cache_mode: "Q8"

  # Embeddings. Small enough to stay resident alongside the main slot, so RAG
  # traffic does not evict the chat model.
  nomic-embed-text:
    backend: ollama
    base_url: "http://127.0.0.1:11434"
    upstream_model: "nomic-embed-text"
    vram_mb: 350
    coexist: true
    params:
      keep_alive: "60m"

  # ---- cross-backend bench matrix -------------------------------------------
  #
  # The same two models (a dense 32B and a 30B-A3B MoE) served by all three
  # runtimes at the ~4-bit class each backend uses, so cmd/llmbench and
  # scripts/solve-swebench.sh compare ollama vs vLLM vs ExLlamaV3 like for like.
  # FP8 is not in the grid for these sizes: a 30-32B model at FP8 exceeds the
  # 24 GB card, so the fair shared point is 4-bit (GGUF Q4 / AWQ int4 / EXL3
  # 4bpw). The 14B FP8 and gpt-oss entries below are a separate, smaller tier.
  # Weights are provisioned by scripts (catalog/models.manifest.yaml); until then
  # these resolve but 502 at request time.

  # Dense 32B, GGUF Q4_K_M through Ollama. The ollama arm of the dense grid.
  qwen3-32b:
    backend: ollama
    base_url: "http://127.0.0.1:11434"
    upstream_model: "qwen3:32b"
    vram_mb: 20000
    params:
      quant: "gguf-q4_k_m"
      keep_alive: "30m"

  # ---- Muse Glimmer (llama-server) ------------------------------------------
  #
  # Meta's Muse Glimmer 30B, the first Meta Superintelligence Labs open release:
  # multimodal (text + image), 128K context, Apache-2.0, built for always-on
  # local agent workflows. Unsloth's UD-Q4_K_XL dynamic quant is 14.8 GiB on
  # disk and holds ~19.0 GB resident with a 32K q8_0 KV cache and the vision
  # projector loaded, rising to ~21 GB once the first image is encoded and the
  # mtmd buffers are allocated. Text-only (no --mmproj) it is 15.1 GB.
  #
  # The flags follow Unsloth's model card: the BF16 projector for image input
  # and temp 1.0 / top-p 0.95 / top-k 64 for sampling. The projector is what
  # makes this entry multimodal at all -- without --mmproj llama-server drops
  # the image parts of a request and answers from the text alone, with no error
  # on either side, so an image-blind server looks exactly like a working one.
  #
  # It runs on llama-server, not Ollama: as of Ollama 0.32.7 Muse Glimmer is
  # served only by the MLX engine on Apple Silicon (the registry's GGUF tags
  # 412 on a CUDA host), while llama.cpp merged the architecture in 62bf73d2.
  # That commit is newer than every tagged win-cuda release, so the box builds
  # llama.cpp from master in WSL2 and the gateway adopts the already-healthy
  # server over localhostForwarding, exactly as it does for vLLM.
  #
  # NOT AUTOSTARTED. scripts/10-llamacpp-muse.sh, which wrote and enabled the
  # llama-muse-glimmer unit, has been removed along with the unit itself: an
  # enabled unit here starts on every WSL boot and takes most of the 24 GB card
  # out from under whatever else is being measured, which is exactly what it did
  # during the Qwen3.8 bring-up. The weights are still staged at the path below
  # and scripts/11-llamacpp-qwen38.sh builds the same shared llama.cpp checkout,
  # so serving this again is one llama-server invocation on port 8080 -- but it
  # is now a deliberate act rather than a boot-time default.
  muse-glimmer-30b:
    backend: llama
    base_url: "http://127.0.0.1:8080"
    upstream_model: "/root/models/gguf/Muse-Glimmer-30B-UD-Q4_K_XL.gguf"
    vram_mb: 21000
    params:
      bin: "/root/llama.cpp/build/bin/llama-server"
      quant: "gguf-ud-q4_k_xl"
      n_ctx: 32768
      n_gpu_layers: 999
      flash_attn: true
      cache_type_k: "q8_0"
      cache_type_v: "q8_0"
      mmproj_path: "/root/models/gguf/mmproj-Muse-Glimmer-30B-BF16.gguf"
      temp: 1.0
      top_p: 0.95
      top_k: 64

  # Qwen3.8-27B, Unsloth's UD-Q4_K_XL dynamic quant, through llama-server on port
  # 8083 (provisioned by scripts/11-llamacpp-qwen38.sh). Native vision-language,
  # so the BF16 projector is wired the same way Muse Glimmer's is.
  #
  # This is the one 27B-class model on the roster that fits the 4090 with room to
  # spare: 19.3 GB resident at 32K context with the projector loaded. The reason
  # is the architecture, not the quant. Qwen3.8 is hybrid-attention -- a
  # full_attention_interval of 4 over 64 layers means only 16 layers keep a
  # growing KV cache (~16 KiB/token at q8_0); the other 48 are Gated DeltaNet
  # linear-attention layers holding a fixed-size recurrent state (~150 MiB per
  # sequence, flat in context length). Context is nearly free here in a way it is
  # not on any dense entry above, which is why 32K costs what 8K costs.
  #
  # Sampling is the model card's Thinking preset (temp 1.0, top-p 0.95, top-k 20,
  # repeat-penalty 1.0). repeat_penalty is pinned rather than left off because
  # llama.cpp defaults it to 1.1 -- see the note in backend/llama.go.
  #
  # Reasoning effort is a chat-template knob, not a flag: pass
  # chat_template_kwargs.reasoning_effort (xhigh default, medium, low) per
  # request. The measured cost of that dial is in bench/README.md.
  qwen3.8-27b:
    backend: llama
    base_url: "http://127.0.0.1:8083"
    upstream_model: "/root/models/gguf/Qwen3.8-27B-UD-Q4_K_XL.gguf"
    vram_mb: 20000
    params:
      bin: "/root/llama.cpp/build/bin/llama-server"
      quant: "gguf-ud-q4_k_xl"
      n_ctx: 32768
      n_gpu_layers: 999
      flash_attn: true
      cache_type_k: "q8_0"
      cache_type_v: "q8_0"
      mmproj_path: "/root/models/gguf/mmproj-Qwen3.8-27B-BF16.gguf"
      temp: 1.0
      top_p: 0.95
      top_k: 20
      repeat_penalty: 1.0

  # The same weights with Meta's DFlash draft head attached for speculative
  # decoding. Commented out because it currently buys nothing on this box, the
  # same way the slow inproc entries below are parked with their measurements.
  #
  # llama.cpp b10355 accepts --spec-draft-model and logs the head as loaded, but
  # it never becomes resident (VRAM 15491 MB with the draft vs 15487 MB without,
  # a 4 MB delta on a 1.5 GiB head) and decode does not move: 49.8 / 49.9 / 48.5
  # / 46.8 tok/s across the 512-32K sweep against 50.8 / 50.5 / 49.2 / 46.6
  # without it, i.e. inside run-to-run noise. Re-tested on b10380 (2026-08-12):
  # unchanged, 50.9 tok/s at 512 and 47.0 at 32K against 51.2 / 46.6 without,
  # same log line, same 19469 MB. The server explains why at load:
  #
  #   llama_init_from_model: failed to initialize the context: dflash requires
  #   ctx_other to be set
  #
  # DFlash needs a second context llama.cpp does not yet wire up, so the head is
  # loaded and then unused. Meta's 3.1x figure is measured on an RTX 5090 with
  # their own runtime, and Ollama ships DFlash only in the MLX engine on Apple
  # Silicon. Uncomment once a llama.cpp build sets ctx_other; the gateway side
  # (params.draft_path and friends) is already implemented and tested.
  #
  # muse-glimmer-30b-dflash:
  #   backend: llama
  #   base_url: "http://127.0.0.1:8080"
  #   upstream_model: "/root/models/gguf/Muse-Glimmer-30B-UD-Q4_K_XL.gguf"
  #   vram_mb: 22600
  #   params:
  #     bin: "/root/llama.cpp/build/bin/llama-server"
  #     quant: "gguf-ud-q4_k_xl"
  #     n_ctx: 32768
  #     n_gpu_layers: 999
  #     flash_attn: true
  #     cache_type_k: "q8_0"
  #     cache_type_v: "q8_0"
  #     mmproj_path: "/root/models/gguf/mmproj-Muse-Glimmer-30B-BF16.gguf"
  #     temp: 1.0
  #     top_p: 0.95
  #     top_k: 64
  #     draft_path: "/root/models/gguf/dflash-kquant.gguf"
  #     gpu_layers_draft: 99
  #     draft_max: 6
  #     draft_min: 1

  # The vLLM arms of the dense and MoE bench grids (qwen3-32b-awq on 8102 and
  # qwen3-30b-a3b-awq on 8103) were removed along with their weights to make room
  # for Qwen3.8. The grids keep their ollama, TabbyAPI/EXL3 and llama.cpp arms;
  # the cross-backend comparison at 30B/32B no longer has a vLLM column. Restore
  # by re-adding the entries here and the manifest rows, then re-downloading.

  # MoE 30B-A3B, ~4bpw EXL3 through TabbyAPI/ExLlamaV3. The MoE arm on ExLlamaV3.
  qwen3-30b-a3b-exl3:
    backend: tabby
    base_url: "http://127.0.0.1:5000"
    upstream_model: "Qwen3-30B-A3B-exl3-4.0bpw"
    vram_mb: 18000
    params:
      quant: "exl3"
      admin_key: "REPLACE_ME_tabby_admin_key"
      max_seq_len: 32768
      cache_mode: "Q8"

  # ---- inproc (llama.cpp zero-proxy) entries --------------------------------
  #
  # The inproc backend loads the GGUF directly into the gateway process via CGO.
  # No Ollama subprocess, no HTTP hop. Needs `make build-llama` with libllama.so
  # on LD_LIBRARY_PATH. Measured on RTX 4090 b9780 (spec 2065 doc 18):
  #
  #   dense 32B models:  ~41 tok/s inproc vs ~26 tok/s Ollama (+59%)
  #   qwen3.6:27b (SSM): ~18.3 tok/s inproc vs ~47.5 tok/s Ollama (39%)
  #   qwen3.6:35b (MoE): ~18.9 tok/s inproc vs ~175 tok/s Ollama (11%)
  #   gpt-oss:20b (MoE): ~23.5 tok/s inproc vs ~170 tok/s Ollama (14%)
  #
  # New-arch models are slow through inproc because b9780 SSM/MoE CUDA kernel
  # paths are newly added and not yet optimized. Use the vllm entries below for
  # qwen3.6:35b and gpt-oss:20b where MoE dispatch matters.

  # Dense coder, best inproc model. Speculative decoding with a 1.7B draft can
  # push to ~60+ tok/s in greedy mode. Uncomment and set model_path.
  #
  # qwen3-coder-inproc:
  #   backend: inproc
  #   upstream_model: qwen3-coder-30b
  #   vram_mb: 21000
  #   params:
  #     model_path: "/models/gguf/Qwen3-Coder-30B-UD-Q4_K_XL.gguf"
  #     draft_path: "/models/gguf/Qwen3-1.7B-Q4_K_M.gguf"
  #     n_ctx: 32768
  #     n_gpu_layers: 99
  #     flash_attn: true
  #     cache_type_k: "q8_0"
  #     cache_type_v: "q8_0"
  #     draft_max: 6
  #     temperature: 0.0

  # qwen3.6:27b inproc - hybrid SSM/attention, 18.3 tok/s. Ollama wins here
  # until llama.cpp SSM kernels mature. Uncomment for benchmarking.
  #
  # qwen3-27b-inproc:
  #   backend: inproc
  #   upstream_model: qwen3.6:27b
  #   vram_mb: 16040
  #   params:
  #     model_path: "/mnt/c/Users/gopher/.ollama/models/blobs/sha256-83c54730a5fea..."
  #     n_ctx: 4096
  #     n_gpu_layers: 99
  #     flash_attn: true
  #     cache_type_k: "q8_0"
  #     cache_type_v: "q8_0"

  # qwen3.6:35b inproc - hybrid SSM+MoE, 18.9 tok/s. vLLM backend preferred.
  #
  # qwen3-35b-inproc:
  #   backend: inproc
  #   upstream_model: qwen3.6:35b
  #   vram_mb: 22236
  #   params:
  #     model_path: "/mnt/c/Users/gopher/.ollama/models/blobs/sha256-f5ee307a29821..."
  #     n_ctx: 4096
  #     n_gpu_layers: 99
  #     flash_attn: true
  #     cache_type_k: "q8_0"
  #     cache_type_v: "q8_0"

  # gpt-oss:20b inproc - MoE MXFP4, 23.5 tok/s. vLLM backend preferred.
  #
  # gpt-oss-20b-inproc:
  #   backend: inproc
  #   upstream_model: gpt-oss:20b
  #   vram_mb: 12992
  #   params:
  #     model_path: "/mnt/c/Users/gopher/.ollama/models/blobs/sha256-e7b273f9636059..."
  #     n_ctx: 4096
  #     n_gpu_layers: 99
  #     flash_attn: true
  #     cache_type_k: "q8_0"
  #     cache_type_v: "q8_0"

  # ---- vLLM entries ---------------------------------------------------------
  #
  # vLLM (Option B) uses FlashInfer fused kernels and chunked prefill.
  # Only one vLLM model can be resident at a time on the 24 GB RTX 4090;
  # the gateway's hot_swap unloads the current model before loading the next.
  #
  # Port assignments (must match 08-vllm.sh):
  #   8100 - qwen3.8-27b-fp8
  #   8101 - gpt-oss-20b-vllm
  #
  # Requires scripts/08-vllm.sh to be run once to install vLLM and write the
  # systemd units. Then enable and start: systemctl enable --now vllm-gpt-oss-20b

  # Qwen3.8-27B-FP8: the same model as the qwen3.8-27b GGUF entry above, at FP8
  # through vLLM, kept as the quality reference the 4-bit quant is measured
  # against rather than as a serving path.
  #
  # IT DOES NOT START ON THIS CARD. The entry is kept because the weights are on
  # the box and the failure is worth recording, not because it serves. Nothing
  # should route here by alias, and it is not autostarted.
  #
  # The checkpoint is 30.89 GB (28.77 GiB) of weights against 22.07 GiB usable at
  # gpu_memory_utilization 0.92, which is the ceiling here: the Windows desktop
  # compositor holds ~1.5 GiB of the 23.99 GiB the card reports, and 0.93 fails
  # allocation by 0.02 GiB. So CPU offload is mandatory, and it is bracketed by
  # two independent failures with no confirmed gap between them:
  #
  #   cpu_offload_gb 8, 10 -> "No available memory for the cache blocks", even at
  #                           max_model_len 4096 and max_num_seqs 2.
  #   cpu_offload_gb 12    -> the offload reaches the Gated DeltaNet weights, and
  #                           the GDN prefill warmup is a Triton kernel that
  #                           cannot address host memory: "Pointer argument
  #                           cannot be accessed from Triton (cpu tensor?)".
  #
  # That upper bound is structural, not a tuning problem: unlike a plain
  # transformer, this model cannot trade more offload for more KV room, because
  # past ~12 GiB the offloaded tensors are ones a Triton kernel must touch.
  # cpu_offload_gb 11 is the only untested value -- the one attempt at it
  # overlapped a second tenant on the card and is not trustworthy. See
  # bench/README.md.
  #
  # Host RAM is a prerequisite before retrying: CPU offload pins the offloaded
  # weights, so WSL2 needs its .wslconfig memory ceiling well above the offload
  # size. enforce_eager is on because CUDA graph capture over a partially
  # offloaded model is where this falls over first.
  qwen3.8-27b-fp8:
    backend: vllm
    base_url: "http://127.0.0.1:8100"
    upstream_model: "/models/hf/Qwen3.8-27B-FP8"
    vram_mb: 23000
    params:
      quant: "fp8"
      quantization: ""          # native FP8 checkpoint; do not pass --quantization
      gpu_memory_utilization: "0.92"   # 0.93 fails: desktop compositor holds ~1.5 GiB
      max_model_len: "8192"
      kv_cache_dtype: "fp8"
      cpu_offload_gb: "11"      # only value not yet ruled out; see the bracket above
      enforce_eager: true
      enable_chunked_prefill: "true"

  # gpt-oss-20b: native MXFP4 MoE, 12.8 GiB, FP8 KV cache, max_model_len 8192.
  # Run: systemctl start vllm-gpt-oss-20b
  gpt-oss-20b-vllm:
    backend: vllm
    base_url: "http://127.0.0.1:8101"
    upstream_model: "/models/hf/gpt-oss-20b"
    vram_mb: 22000
    params:
      gpu_memory_utilization: "0.92"
      max_model_len: "8192"
      kv_cache_dtype: "fp8"
      enable_chunked_prefill: "true"

manager:
  hot_swap: true          # unload the outgoing model before loading the next
  vram_budget_mb: 22528   # 22 GB minus a 512 MiB margin on the 24 GB card
  queue_max: 32           # requests allowed to wait behind an in-flight swap
  drain_timeout_s: 120    # how long to wait for in-flight requests before a swap
  load_timeout_s: 300     # process-driven backends (vLLM) can take minutes to load
  unload_timeout_s: 30

logging:
  level: info
  format: json
  file: "/var/log/llmgw/requests.log"  # empty logs to stdout instead
  rotate_mb: 100
  keep_files: 5
